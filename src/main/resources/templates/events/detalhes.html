<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <title>Eventos</title>
</head>

<body>

<div th:replace="~{menu :: menu}"></div>

<div class="container">

    <h1>Detalhes do Evento</h1>

    <!-- CARD DE DETALHES DO EVENTO -->
    <div class="row">
        <div class="col s12">
            <div class="card">
                <div class="card-content">

                    <span class="card-title">Evento</span>

                    <p>
                        <strong>Id:</strong>
                        <span th:text="${event.id}"></span>
                    </p>

                    <p>
                        <strong>Nome:</strong>
                        <span th:text="${event.name}"></span>
                    </p>

                    <p>
                        <strong>Local:</strong>
                        <span th:text="${event.local}"></span>
                    </p>

                    <p>
                        <strong>Data:</strong>
                        <span th:text="${event.date}"></span>
                    </p>

                    <p>
                        <strong>Horário:</strong>
                        <span th:text="${event.hour}"></span>
                    </p>

                </div>
            </div>
        </div>
    </div>


    <!-- CARD DE ADICIONAR CONVIDADO -->
    <div class="row">
        <div class="col s12">
            <div class="card">
                <div class="card-content">

                    <span class="card-title">Adicionar Convidado</span>

                    <form action="" method="post">

                        <div>
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>

                        <div>
                            <label for="rg">RG:</label>
                            <input type="text" id="rg" name="rg" required>
                        </div>

                        <div>
                            <button class="btn" type="submit">
                                Salvar
                            </button>

                            <button class="btn" type="reset">
                                Limpar
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>


    <!-- CARD DA LISTA DE CONVIDADOS -->
    <div class="row">
        <div class="col s12">
            <div class="card">
                <div class="card-content">

                    <span class="card-title">Lista de Convidados</span>

                    <table class="highlight">

                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nome</th>
                            <th>RG</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="c : ${convidados}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.nome}"></td>
                            <td th:text="${c.rg}"></td>
                        </tr>

                        </tbody>

                    </table>

                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
