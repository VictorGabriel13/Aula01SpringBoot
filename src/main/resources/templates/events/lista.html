<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <title>Eventos</title>
    <!-- <link rel="stylesheet" th:href="@{/style/formEVents.css}"> -->
</head>

<body>
    <div th:replace="~{menu :: menu}"></div>
    <div class="container">
        <h1>Lista de Eventos</h1>
        <table  class="highlight">
          <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Local</th>
                <th>Data</th>
                <th>Horário</th>
            </thead>
          <tbody>
            <tr th:each="evento: ${events}">
              <td th:text="${evento.id}"></td>
              <td> <a th:href="@{/events/{id}(id=${evento.id})}"><span th:text="${evento.name}"></span></a></td>
              <td th:text="${evento.local}"></td>
              <td th:text="${evento.date}"></td>
              <td th:text="${evento.hour}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
